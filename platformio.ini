[env:hosyond-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0

board_upload.flash_size = 16MB
board_build.flash_mode = qio
; This chip is a real WROOM-1 N16R8: 16MB QSPI flash + 8MB OPI (octal)
; PSRAM, confirmed via ESP.getPsramSize() == 8388608 under qio_opi. An
; earlier test wrongly concluded "no PSRAM" using qio_qspi (quad-mode PSRAM
; init) -- the octal chip doesn't come up under that sequence at all. See
; OregonTrailS3's platformio.ini/HOSYOND_ESP32S3_TARGET.md for the same
; board confirmed the same way.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM